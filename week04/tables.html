<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Tables</title>

    <link rel="stylesheet" href="styles/tables.css">
</head>
<body>
<table>
    <thead>
        <tr>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Email</th>
        </tr>
    </thead>
    

    <tbody>
        <tr>
            <td>John</td>
            <td>Doe</td>
            <td>john@example.com</td>
        </tr>

        <tr>
            <td>Jane</td>
            <td>Smith</td>
            <td>jane@example.com</td>
        </tr>

        <tr>
            <td>Bob</td>
            <td>Johnson</td>
            <td>bob@example.com</td>
        </tr>
    </tbody>
</table>

<table>
    <thead>
        <tr>
            <th colspan="3">Employee Directory</th>
        </tr>

        <tr>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Email</th>
        </tr>
    </thead>

    <tbody>
    <tr>
        <td>Ana</td>
        <td>95</td>
        <td>90</td>
    </tr>

    <tr>
        <td>Bob</td>
        <td>88</td>
        <td>92</td>
    </tr>
</tbody>
</table>

<table>
    <thead>
        <tr>
            <th>Name</th>
            <th>Role</th>
        </tr>
    </thead>

    <tbody>
        <tr>
            <td rowspan="2">John</td>
            <td>Manager</td>
        </tr>

        <tr>
            <td>Supervisor</td>
        </tr>

        <tr>
            <td>Jane</td>
            <td>Developer</td>
        </tr>
    </tbody>
</table>

</body>
</html>
