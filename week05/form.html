<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product Review Form">
    <meta name="author" content="Jonathan Pacheco Mera">

    <title>Product Review</title>

   <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>

</head>
<body>

    <header>
        <h1>Product Review</h1>
    </header>

    <main>

    <form method="get" action="review.html">

    <label for="product">Product Name *</label>

    <select id="product" name="product" required>
        <option value="" selected disabled>
            Select a Product ...
        </option>
    </select>

    <label for="star1">Overall Rating *</label>

<div class="rating">

    <input type="radio" id="star1" name="rating" value="1" required>
    <label for="star1">☆</label>

    <input type="radio" id="star2" name="rating" value="2">
    <label for="star2">☆☆</label>

    <input type="radio" id="star3" name="rating" value="3">
    <label for="star3">☆☆☆</label>

    <input type="radio" id="star4" name="rating" value="4">
    <label for="star4">☆☆☆☆</label>

    <input type="radio" id="star5" name="rating" value="5">
    <label for="star5">☆☆☆☆☆</label>

</div>
<label for="installationDate">Date of Installation *</label>

<input
    type="date"
    id="installationDate"
    name="installationDate"
    required
    >
<label for="durability">Useful Features</label>

<div class="features">

    <input type="checkbox" id="durability" name="features" value="Durability">
    <label for="durability">Durability</label>

    <input type="checkbox" id="easeOfUse" name="features" value="Ease of Use">
    <label for="easeOfUse">Ease of Use</label>

    <input type="checkbox" id="performance" name="features" value="Performance">
    <label for="performance">Performance</label>

    <input type="checkbox" id="design" name="features" value="Design">
    <label for="design">Design</label>

</div>

<label for="review">Written Review</label>

<textarea id="review" name="review" rows="5"></textarea>

<label for="userName">User Name</label>

<input

    type="text"
    id="userName"
    name="userName">

    <input
    type="submit"
    value="Submit Review">

</form>

    </main>

    <footer>
        <p>
            &copy; <span id="currentyear"></span> Jonathan Pacheco Mera | Brazil
        </p>

        <p id="lastModified"></p>
    </footer>

</body>
</html>
